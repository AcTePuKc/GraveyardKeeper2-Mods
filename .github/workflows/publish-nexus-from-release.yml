name: Publish Nexus From Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag to publish to Nexus
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nexus-date-time-counter-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      REPOSITORY: AcTePuKc/GraveyardKeeper2-Mods
      NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
      NEXUS_MOD_ID: ${{ secrets.NEXUS_MOD_ID_DATE_TIME_COUNTER }}
      NEXUS_FILE_ID: ${{ secrets.NEXUS_FILE_ID_DATE_TIME_COUNTER }}
      NEXUS_GAME_DOMAIN: graveyardkeeper2

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Resolve and validate release metadata
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_TAG)) { throw "A GitHub release tag is required." }
          if ($env:RELEASE_TAG -notmatch '^v(?<version>\d+\.\d+\.\d+)$') { throw "Expected a vMAJOR.MINOR.PATCH release tag." }
          if ([string]::IsNullOrWhiteSpace($env:NEXUS_API_KEY) -or [string]::IsNullOrWhiteSpace($env:NEXUS_MOD_ID)) {
            throw "NEXUS_API_KEY or NEXUS_MOD_ID_DATE_TIME_COUNTER is not configured."
          }
          $changelog = (Get-Content -LiteralPath "mods/date-time-and-counter/CHANGELOG.txt" -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($changelog)) { throw "Nexus changelog is empty." }
          "version=$($Matches.version)" >> $env:GITHUB_OUTPUT
          "display_name=Date Time and Counter $($Matches.version)" >> $env:GITHUB_OUTPUT
          "changelog<<NEXUS_CHANGELOG_EOF" >> $env:GITHUB_OUTPUT
          $changelog >> $env:GITHUB_OUTPUT
          "NEXUS_CHANGELOG_EOF" >> $env:GITHUB_OUTPUT

      - name: Download the exact release archive
        id: download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          $downloadDir = Join-Path $env:GITHUB_WORKSPACE "release-download"
          New-Item -ItemType Directory -Force -Path $downloadDir | Out-Null
          $downloadOutput = gh release download $env:RELEASE_TAG --repo $env:REPOSITORY --pattern "DateTimeAndCounter-${{ steps.release.outputs.version }}.zip" --dir $downloadDir --clobber 2>&1
          if ($LASTEXITCODE -ne 0) { throw "GitHub CLI could not download the release asset: $downloadOutput" }
          $archive = Join-Path $downloadDir "DateTimeAndCounter-${{ steps.release.outputs.version }}.zip"
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) { throw "Expected release archive was not downloaded." }
          "asset_path=$archive" >> $env:GITHUB_OUTPUT

      - name: Validate archive layout
        shell: pwsh
        run: |
          $extract = Join-Path $PWD "release-archive-check"
          Expand-Archive -LiteralPath "${{ steps.download.outputs.asset_path }}" -DestinationPath $extract
          $required = @(
            "BepInEx/plugins/GK2.DayCounter/GK2.DayCounter.dll",
            "BepInEx/plugins/GK2.DayCounter/Locales/en.json",
            "BepInEx/plugins/GK2.Framework/Localization/com.actepukc.gk2.datetimeandcounter/en.json"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path $extract ($path -replace '/', '\')) -PathType Leaf)) {
              throw "Release archive is missing required file: $path"
            }
          }

      - name: Preflight Nexus mod page
        shell: pwsh
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
          NEXUS_MOD_ID: ${{ secrets.NEXUS_MOD_ID_DATE_TIME_COUNTER }}
        run: |
          $headers = @{ apikey = $env:NEXUS_API_KEY; "User-Agent" = "AcTePuKc/GraveyardKeeper2-Mods release workflow" }
          $uri = "https://api.nexusmods.com/v3/games/graveyardkeeper2/mods/$($env:NEXUS_MOD_ID)"
          $page = Invoke-RestMethod -Uri $uri -Headers $headers
          if (-not $page.data.id) { throw "Nexus mod page did not return its API ID." }

      - name: Bootstrap first Nexus file
        if: ${{ env.NEXUS_FILE_ID == '' }}
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
          NEXUS_MOD_ID: ${{ secrets.NEXUS_MOD_ID_DATE_TIME_COUNTER }}
          NEXUS_GAME_DOMAIN: graveyardkeeper2
          RELEASE_ASSET: ${{ steps.download.outputs.asset_path }}
          MOD_VERSION: ${{ steps.release.outputs.version }}
          MOD_DISPLAY_NAME: ${{ steps.release.outputs.display_name }}
          MOD_DESCRIPTION: ${{ steps.release.outputs.changelog }}
          MOD_FILE_CATEGORY: main
        run: node .github/scripts/nexus-bootstrap-upload.mjs

      - name: Update existing Nexus file
        if: ${{ env.NEXUS_FILE_ID != '' }}
        uses: Nexus-Mods/upload-action@c96019556046053aa26044b44396cd38929daf23
        with:
          api_key: ${{ secrets.NEXUS_API_KEY }}
          file_id: ${{ secrets.NEXUS_FILE_ID_DATE_TIME_COUNTER }}
          filename: ${{ steps.download.outputs.asset_path }}
          version: ${{ steps.release.outputs.version }}
          display_name: ${{ steps.release.outputs.display_name }}
          description: ${{ steps.release.outputs.changelog }}
          category: main
          archive_existing_version: false
          update_mod_version: true
          primary_mod_manager_download: true
          allow_mod_manager_download: true
          show_requirements_pop_up: false
